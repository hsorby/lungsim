      #      run: |
      #        scripts/install_windows.bat $WINDOWS_HPCKIT_URL $WINDOWS_FORTRAN_COMPONENTS

      # Delete the following if you don't want to save install logs
      #    - name: Saving install logs
      #      if: runner.os == 'Windows' && steps.cache-install.outputs.cache-hit != 'true'
      #      uses: actions/upload-artifact@v2
      #      with:
      #        name: InstallLogs_${{ github.job }}
      #        path: |
      #          oneapi/bootstrapper*
      #          oneapi/installer*
      #        retention-days: 7

      # Add in for building a simple Fortran application to test the Fortran compiler is working.
      #   - name: Build oneAPI HPC kit
      #      if: runner.os == 'Windows'
      #      shell: bash
      #      run: oneapi/scripts/build_windows.bat fortran "" $SAMPLES_TAG

      #    - name: Exclude unused files from cache
      #      if: runner.os == 'Windows' && steps.cache-install.outputs.cache-hit != 'true'
      #      working-directory: oneapi
      #      run: scripts/cache_exclude_windows.ps1

      - name: Checkout lungsim
        uses: actions/checkout@v6
        with:
          path: lungsim

      - name: Report CMake version
        run: cmake --version

      - name: Install Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC environment
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Generate build instructions - Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set fixed_abs_fc="C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin\ifx.exe"
          echo "Absolute path to fc: %fixed_abs_fc%"

          REM cmake -S lungsim -B build-lungsim -G Ninja -D AETHER_ENABLE_TESTS=FALSE
          cmake -S lungsim -B build-lungsim -D CMAKE_Fortran_COMPILER="%FC%.exe" -D CMAKE_C_COMPILER="%CC%.exe" -D CMAKE_CXX_COMPILER="%CXX%.exe" -D AETHER_ENABLE_TESTS=FALSE

      - name: Build lungsim
        run: |
          cmake --build build-lungsim --config Release

      - name: Test lungsim
        shell: bash
        run: |
          cd build-lungsim
          ctest --output-on-failure
          if [ "${{ runner.os }}" == "Windows" ]; then
            multi_config_dir=/${{ matrix.config.build_type }}
          fi

          python -m pipinstall wheel
          python -m pip install $GITHUB_WORKSPACE/build-lungsim/src/bindings/python$multi_config_dir

          if [ "${{ runner.os }}" == "Windows" ]; then
            # Horrible hack for GitHub actions Windows virtual machine.
            prefix_path=$(dirname $(dirname python))
            
            cp $prefix_path/Library/bin/libifcoremd.dll $GITHUB_WORKSPACE/venv/Lib/site-packages/aether
            cp $prefix_path/Library/bin/libmmd.dll $GITHUB_WORKSPACE/venv/Lib/site-packages/aether
            cp $prefix_path/Library/bin/svml_dispmd.dll $GITHUB_WORKSPACE/venv/Lib/site-packages/aether
          fi

          python $GITHUB_WORKSPACE/lungsim/.github/scripts/diagnostics_test.py

          exit $?
